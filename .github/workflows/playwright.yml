name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly at 02:30 UTC (08:00 IST)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      UI_BASE_URL: https://www.saucedemo.com
      API_BASE_URL: https://dummyjson.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (pull requests)
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep @smoke

      - name: Run full regression suite (main, nightly, manual)
        if: github.event_name != 'pull_request'
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker:
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose build

      - name: Run full suite in container
        run: docker compose run --rm playwright

      - name: Upload HTML report (docker)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-docker
          path: playwright-report/
          retention-days: 30